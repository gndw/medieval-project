[package]
name = "medieval-project"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
ctrlc = "3.5.2"
hecs = "0.11.1"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
